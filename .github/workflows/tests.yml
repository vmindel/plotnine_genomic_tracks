name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            plotnine: "plotnine==0.15.8"
          - python-version: "3.12"
            plotnine: "plotnine==0.15.8"
          - python-version: "3.13"
            plotnine: "plotnine @ git+https://github.com/has2k1/plotnine"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install "${{ matrix.plotnine }}" -e ".[test]"
      - run: pytest -q
